name: Deploy no GitHub Pages

# Publica em https://kazenski.github.io/jogo_idle_imperiall_2026/ a cada push
# na main. Sem isso, o Pages so atualiza quando alguem faz push na pasta gh-pages.
on:
  push:
    branches: [main]
  # Permite rodar a build sem commitar, pelo aba Actions do GitHub.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serializa os deploys: dois pushes seguidos nao podem disputar o ambiente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Gera os icones a partir da arte procedural, para o PWA nunca
      # depender de um binario esquecido no repo.
      - name: Gerar icones
        run: npm run icones

      - name: Build
        run: npm run build

      # `base` do Vite esta fixado em /jogo_idle_imperiall_2026/. Se um dia este
      # repo virar site de usuario (github.io/Kazenski), mude o base no vite.config.ts
      # E este check falha — que e o ponto: avisa em vez de subir 404 silencioso.
      - name: Verificar caminhos base
        run: |
          grep -q '/jogo_idle_imperiall_2026/assets/' dist/index.html \
            || { echo "::error::base do Vite nao bate com o prefixo do Pages"; exit 1; }

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4